version: 1

worktree_dir: "../worktrees"

project_name: "wct"

# Gitignored files to copy from the main repository during Open
copy:
  - .vscode/
  - .claude/

setup:
  - name: "Mise setup"
    command: "mise trust mise.toml && mise install"
  - name: "Install dependencies"
    command: "bun install"
  - name: "Prepare Effect tooling"
    command: "bun run prepare"

tmux:
  windows:
    - name: "ai"
      command: "claude"
    - name: "dev"
      split: "vertical"
      panes:
        - command: "lazygit"
        - {}

profiles:
  codex:
    tmux:
      windows:
        - name: "ai"
          command: "codex"
        - name: "dev"
          split: "vertical"
          panes:
            - command: "lazygit"
            - {}
