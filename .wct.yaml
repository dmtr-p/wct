# wct configuration for this project
version: 1

# Base directory for worktrees
worktree_dir: "../worktrees"

# Configured project name (used for worktree and tmux session naming)
project_name: "wct"

# Gitignored files to copy from the main repository during Open
copy:
  - .vscode/
  - .claude/

# Commands to run during Open, after copying and before starting tmux
setup:
  - name: "Mise setup"
    command: "mise trust mise.toml && mise install"
  - name: "Install dependencies"
    command: "bun install"
  - name: "Prepare Effect tooling"
    command: "bun run prepare"

# Tmux session configuration
tmux:
  windows:
    - name: "ai"
      command: "claude"
    - name: "dev"
      split: "vertical"
      panes:
        - command: "lazygit"
        - {}

profiles:
  codex:
    tmux:
      windows:
        - name: "ai"
          command: "codex"
        - name: "dev"
          split: "vertical"
          panes:
            - command: "lazygit"
            - {}
