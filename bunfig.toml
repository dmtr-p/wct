[install]
# Age-gate: delay package installation by 3 days
minimumReleaseAge = 259200

# Block all lifecycle/postinstall scripts globally
ignoreScripts = true

# Enforce strict isolated dependency resolution (prevents phantom deps)
linker = "isolated"

# Prevent dynamic runtime auto-installation
auto = "disable"

[fmt]
printWidth = 80
tabWidth = 2
useTabs = false
semi = true
singleQuote = false
sortPackageJson = false
ignorePatterns = ["bun.lock"]

[fmt.sortImports]
newlinesBetween = false
groups = [
  ["value-builtin", "type-builtin"],
  ["value-external", "type-external"],
  ["value-internal", "type-internal"],
  [
    "value-parent",
    "type-parent",
    "value-sibling",
    "type-sibling",
    "value-index",
    "type-index",
  ],
  "unknown",
]

