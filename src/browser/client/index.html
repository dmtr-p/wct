<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wct terminal</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main>
      <aside id="sidebar" aria-label="Workspaces">
        <button id="local-host" aria-expanded="true">
          ▾ Local host · this machine
        </button>
        <p id="sidebar-status" role="status">Loading existing Workspaces…</p>
        <label
          >Filter <input id="workspace-filter" type="search" autocomplete="off"
        /></label>
        <label
          >Sidebar width
          <input
            id="sidebar-width"
            type="range"
            min="180"
            max="480"
            value="260"
        /></label>
        <nav id="workspace-tree" aria-label="Projects and Workspaces"></nav>
      </aside>
      <section id="terminal-area">
        <h1>wct terminal</h1>
        <p id="status" role="status">Connecting…</p>
        <div id="terminal" aria-label="Workspace terminal"></div>
      </section>
    </main>
  </body>
</html>
